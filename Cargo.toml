[workspace]
resolver = "2"

members = [
    "src/canister/platform_orchestrator",
    "src/canister/user_info_service",
    "src/canister/user_post_service",
    "src/lib/integration_tests",
    "src/lib/shared_utils",
    "src/lib/test_utils",
    "src/canister/rate_limits",
    "src/lib/ic_canister_snapshot",
    "src/lib/task_runner",
]

[workspace.dependencies]
candid = "0.10.29"
ciborium = "0.2.1"
pocket-ic = "6.0.0"
ic-agent = { version = "0.47.3", features = ["pem"] }
ic-cdk = "0.15.1"
ic-cdk-timers = "0.7.0"
ic-cdk-macros = "0.16.0"
ic-stable-structures = "0.6.2"
ic-ledger-types = "0.9.0"
ic-test-state-machine-client = "3.0.0"
rmp-serde = "1.1.2"
serde = "1.0.186"
thiserror = "2.0.12"
futures = "0.3.29"
shared_utils = { path = "./src/lib/shared_utils" }
test_utils = { path = "./src/lib/test_utils" }
serde_json = "1.0.113"
icrc-ledger-types = "0.1.6"
