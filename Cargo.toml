[workspace]
resolver = "2"

members = [
    "src/canister/platform_orchestrator",
    "src/canister/canister_to_harvest",
    "src/lib/shared_utils",
    "src/lib/task_runner",
]

[workspace.dependencies]
candid = "0.10.32"
ciborium = "0.2.1"
ic-agent = { version = "0.47.3", features = ["pem"] }
ic-cdk = "0.15.1"
ic-cdk-timers = "0.7.0"
ic-cdk-macros = "0.16.0"
ic-stable-structures = "0.6.2"
rmp-serde = "1.1.2"
serde = "1.0.186"
thiserror = "2.0.12"
futures = "0.3.29"
shared_utils = { path = "./src/lib/shared_utils" }
serde_json = "1.0.113"
