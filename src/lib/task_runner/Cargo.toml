[package]
name = "task_runner"
version = "0.1.0"
edition = "2021"

[dependencies]
candid = { workspace = true, features = ["value"] }
ic-agent = { workspace = true, features = ["pem"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
